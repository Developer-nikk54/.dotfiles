"$schema" = 'https://starship.rs/config-schema.json'


format = """
[](#626880)\
[ ](bg:#626880 fg:#89b4fa)\
[](bg:#89b4fa fg:#626880)\
$directory\
[](fg:#89b4fa bg:#394260)\
$git_branch\
$git_status\
[](fg:#394260 bg:#212736)\
$nodejs\
$bun\
$rust\
$golang\
$php\
$docker_context\
[](fg:#212736 bg:#1d2230)\
[ ](fg:#1d2230)\
\n\n$character"""

[directory]
style = "fg:#2f2836 bg:#89b4fa"
format = "[ $path ]($style)"
truncation_length = 2
truncation_symbol = "…/"

[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "

[git_branch]
symbol = "  "
style = "bg:#394260"
format = '[[   $symbol $branch ](fg:#769ff0 bg:#394260)]($style)'

[git_status]
style = "bg:#394260"
format = '[[($all_status$ahead_behind )](fg:#769ff0 bg:#394260)]($style)'

[nodejs]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[bun]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[rust]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[golang]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[php]
symbol = ""
style = "bg:#212736"
format = '[[ $symbol ($version) ](fg:#769ff0 bg:#212736)]($style)'

[c]
symbol = ""
style = "bg:teal"
format = '[[ $symbol( $version) ](fg:#769ff0 bg:#212736)]($style)'

[docker_context]
symbol = ""
style = "bg:surface0"
format = '[[ $symbol( $context) ](fg:#769ff0 bg:#212736)]($style)'

[character]
disabled = false

success_symbol = '[#❯](bold fg:green)'
error_symbol = '[#❯](bold fg:red)'
vimcmd_symbol = '[❮#](bold fg:red)'
vimcmd_replace_one_symbol = '[#❯](bold fg:green)'
vimcmd_replace_symbol = '[#❯](bold fg:green)'
vimcmd_visual_symbol = '[❮#](bold fg:red)'
